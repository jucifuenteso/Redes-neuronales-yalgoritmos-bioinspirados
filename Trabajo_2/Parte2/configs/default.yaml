# Configuración por defecto. Cualquier valor se puede cambiar desde la línea de comandos:
#   python run.py lgd --set lgd.mlp.hidden=[128,64] --set lgd.mlp.lr=0.0005
# o con otro archivo:  python run.py lgd --config configs/mi_config.yaml
seed: 42                  # semilla global (partición, búsqueda, muestreo)
seeds_final_start: 1000   # las 30 corridas finales usan semillas 1000..1029
n_seeds: 30

paths:
  raw_csv: data/raw/loan.csv
  processed: data/processed
  models: models
  outputs: outputs        # métricas (csv/json)
  figures: figures

data:
  # Predictores disponibles al originar el crédito. include_lc_pricing=false excluye grade,
  # sub_grade e int_rate: son el puntaje propio de Lending Club, no información del cliente.
  include_lc_pricing: false
  # Partición temporal por fecha de originación (issue_d); la misma de la Parte 1.
  split: temporal         # temporal | random
  train_end: "2012-12-31"
  val_end: "2013-06-30"   # prueba = originados después de esta fecha
  demo_rows: 30000        # tamaño de la muestra en --demo

lgd:
  ridge_alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0]   # referencia: regresión lineal con penalización L2
  mlp:
    hidden: [64, 32]
    activation: relu      # relu | tanh | elu | silu | leaky_relu (la capa de salida siempre es sigmoide)
    dropout: 0.1
    weight_decay: 0.0001  # penalización L2
    optimizer: adam       # adam | adamw | sgd | rmsprop
    lr: 0.001
    batch_size: 512
    epochs: 80
    patience: 8           # parada temprana sobre la pérdida de validación
    loss: bce             # bce (cuasi-verosimilitud Bernoulli) | mse (verosimilitud gaussiana)
  search:
    trials: 30
    epochs: 30
    space:
      n_layers: [1, 2, 3]
      units: [16, 32, 64, 128]
      activation: [relu, tanh, elu, silu]
      dropout: [0.0, 0.1, 0.2, 0.3]
      weight_decay: [0.0, 0.00001, 0.0001, 0.001]
      optimizer: [adam, adamw, rmsprop]
      lr: [0.0003, 0.001, 0.003, 0.01]
      batch_size: [256, 512, 1024]

# Modelos de PD mínimos, solo para poder calcular E[L] = PD·LGD·EAD dentro de esta carpeta.
# Se reemplazan por los de la Parte 1 (ver README, "Conexión con la Parte 1").
pd_ref:
  logreg:
    C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
  mlp:
    hidden: [128, 64]
    activation: relu
    dropout: 0.2
    weight_decay: 0.0001
    optimizer: adam
    lr: 0.001
    batch_size: 1024
    epochs: 40
    patience: 6

demo:
  seeds: 3
  lgd_trials: 3
  epochs: 8
